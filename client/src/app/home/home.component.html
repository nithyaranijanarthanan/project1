<div class="home-container">
  <h2>Users List</h2>

  <div *ngIf="loading" class="loading">Loading...</div>

  <table *ngIf="users.length > 0" class="users-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.status === 1 ? 'Active' : 'Inactive' }}</td>
        <td>
          <button class="btn edit-btn" (click)="editUser(user)">Edit</button>
          <button class="btn delete-btn" (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && users.length === 0">No users found.</div>
</div>
