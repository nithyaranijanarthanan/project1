<div class="home-container">
  <h2>Users List</h2>

  <p-table 
    [value]="users"
    [loading]="loading"
    class="p-datatable-striped p-datatable-gridlines">

    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th style="width: 180px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.status === 1 ? 'Active' : 'Inactive' }}</td>
        <td>
          <button 
            pButton 
            label="Edit"
            icon="pi pi-pencil"
            class="p-button-sm p-button-rounded p-button-info me-2"
            (click)="openEditDialog(user)">
          </button>

          <button 
            pButton 
            label="Delete"
            icon="pi pi-trash"
            class="p-button-sm p-button-rounded p-button-danger"
            (click)="deleteUser(user.id)">
          </button>
        </td>
      </tr>
    </ng-template>

  </p-table>

  <div *ngIf="!loading && users.length === 0">
    No users found.
  </div>
</div>



<p-dialog 
  header="Edit User" 
  [(visible)]="displayEditDialog" 
  [modal]="true" 
  [style]="{width: '400px'}">

  <div class="p-fluid">
    <div class="field">
      <label>Name</label>
      <input pInputText [(ngModel)]="editUserData.name" />
    </div>

    <div class="field">
      <label>Email</label>
      <input pInputText [(ngModel)]="editUserData.email" />
    </div>

    <div class="field">
      <label>Password</label>
      <input pInputText type="password" [(ngModel)]="editUserData.password" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button 
      pButton 
      label="Cancel" 
      class="p-button-text"
      (click)="displayEditDialog=false">
    </button>

    <button 
      pButton 
      label="Save" 
      icon="pi pi-check"
      (click)="saveEdit()">
    </button>
  </ng-template>

</p-dialog>
