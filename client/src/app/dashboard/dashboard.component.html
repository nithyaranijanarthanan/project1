<div class="dashboard-wrapper">

  <!-- Topbar -->
  <div class="topbar">
    <h2>My App</h2>
    <button (click)="logout()">Logout</button>
  </div>

  <!-- Sidebar + Main Content -->
  <div class="content-wrapper">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li>
          <a routerLink="/dashboard/home" routerLinkActive="active">
            <div style="padding: 10px;">
              <fa-icon [icon]="faHome" style="margin-right: 8px;"></fa-icon>
              <span>Home</span>
            </div>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/users" routerLinkActive="active">
            <div style="padding: 10px;">
              <fa-icon [icon]="faUsers" style="margin-right: 8px;"></fa-icon>
              <span>UserList</span>
            </div>
          </a>
        </li>
        <li>
            <div style="padding: 10px;">
              <fa-icon [icon]="faUpload" style="margin-right: 8px;"></fa-icon>
              <span style="font-weight: 500;">Upload File</span>
  </div>
  <div style="padding-left: 40px; margin-top: 8px;">
           <p-fileupload #fu mode="basic" chooseLabel="Choose" chooseIcon="pi pi-upload" name="file" url="http://localhost:3001/upload" accept="image/*" maxFileSize="1000000" (onUpload)="onUpload($event)"(onError)="onUploadError($event)" />
<p-button label="Upload" (click)="fu.upload()" class="p-button-secondary" [style]="{'margin-top': '8px'}"></p-button>
            
</div>
          
        </li>
      </ul>
    </div>

    <!-- Main content -->
    <div class="main-content">
      <router-outlet></router-outlet> <!-- Child routes render here -->
    </div>

  </div>
</div>
